name: Android

on:
  push:
    branches: [main, fergusean/consolidated]
    paths:
      - "apps/android/**"
      - "apps/project.yml"
      - "docs/reference/fixtures/remote-relay-vectors.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/project.yml"
      - "docs/reference/fixtures/remote-relay-vectors.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :app:assembleDebug :app:assembleRelease :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: codync-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
