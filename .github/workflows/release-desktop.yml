name: Release desktop

# The Electron app (apps/desktop) for macOS and Linux. A v* tag publishes it; anything else is a
# dry run that builds, signs and notarizes but publishes nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/release-desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Version matches the host
        # The host's minApp is compared with this app's version (docs/reference/compatibility.md).
        run: |
          APP=$(node -p 'require("./package.json").version')
          HOST=$(python3 -c 'import tomllib; print(tomllib.load(open("../../host/Cargo.toml", "rb"))["package"]["version"])')
          test "$APP" = "$HOST" || { echo "apps/desktop ($APP) and host ($HOST) versions must match"; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  macos:
    needs: check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Apple certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_FILE=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security list-keychain -d user -s "$KEYCHAIN_FILE"

      - name: Native pieces
        run: |
          mkdir -p apps/desktop/build/native
          # The host is built by `npm run dist:mac:main` (tools/native-host.mjs) for the same environment.
          # On-device speech for calls.
          swift build -c release --arch arm64 --arch x86_64 --package-path apps/desktop/native/speech-macos
          cp "$(swift build -c release --arch arm64 --arch x86_64 --package-path apps/desktop/native/speech-macos --show-bin-path)/codync-speech" \
            apps/desktop/build/native/codync-speech
          # Codync Screen (Remote screen capture and input), built unsigned; electron-builder signs it.
          xcodebuild -downloadComponent MetalToolchain || true
          xcodegen generate --spec apps/project.yml
          xcodebuild build -project apps/Codync.xcodeproj -scheme Screen -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/derived -quiet \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          cp -R "$(find build/derived -name CodyncScreen.app -path '*/Release/*' | head -1)" apps/desktop/build/native/
          swift packaging/dmg/background.swift apps/desktop/build/dmg-background.tiff

      - name: Build, sign and notarize
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          npm ci
          npm run icons
          npm run dist:mac:main -- --publish never
          codesign -d --entitlements - dist/mac-universal/Codync.app | grep -q com.apple.security.device.audio-input ||
            { echo "audio-input entitlement missing"; exit 1; }
          spctl --assess --type execute -v dist/mac-universal/Codync.app

      - name: Update feeds
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION=$(node -p 'require("./apps/desktop/package.json").version')
          # The iPhone app this release needs: Macs with iPhones wait until the App Store has it.
          MIN_APP=$(apps/desktop/build/native/codync-host compat | python3 -c 'import json,sys; print(json.load(sys.stdin)["minApp"])')
          printf 'minApp: %s\n' "$MIN_APP" >> apps/desktop/dist/latest-mac.yml
          # Installs of the earlier native app update through Sparkle: one more appcast, now for the zip.
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'SPARKLE_PRIVATE_KEY is required'; exit 1; }
          curl -sSL https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz | tar xJ -C "$RUNNER_TEMP"
          mkdir -p build/updates && cp apps/desktop/dist/codync-macos.zip build/updates/
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/bin/generate_appcast" --ed-key-file - --maximum-deltas 0 \
            --download-url-prefix "https://github.com/leepokai/Codync/releases/download/v${VERSION}/" \
            --link https://www.codync.dev/ -o build/appcast.xml build/updates
          python3 packaging/updates/annotate-appcast.py build/appcast.xml "$MIN_APP"

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: codync-macos
          path: |
            apps/desktop/dist/codync-macos.dmg
            apps/desktop/dist/latest-mac.yml
            build/appcast.xml

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/desktop/dist
          shasum -a 256 codync-macos.dmg > codync-macos.dmg.sha256
          FILES="codync-macos.dmg codync-macos.dmg.sha256 codync-macos.zip codync-macos.zip.blockmap latest-mac.yml ../../../build/appcast.xml"
          # The host workflow may have created this release already (same tag).
          gh release create "$GITHUB_REF_NAME" $FILES --title "Codync $GITHUB_REF_NAME" --generate-notes ||
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber

      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SHA=$(shasum -a 256 apps/desktop/dist/codync-macos.dmg | awk '{print $1}')
          git clone https://x-access-token:${{ secrets.TAP_TOKEN }}@github.com/leepokai/homebrew-codync.git tap
          mkdir -p tap/Casks
          sed -e "s/^  version .*/  version \"$VERSION\"/" -e "s/REPLACE_WITH_SHA256/$SHA/" packaging/homebrew/codync.rb > tap/Casks/codync.rb
          cp packaging/homebrew/README.md tap/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Codync to $VERSION" || exit 0
          git push

  linux:
    needs: check
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x64, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, arch: arm64, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # The Linux app uses the installed codync-host (codync-host-linux-*.tar.gz, host.yml).
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run dist:linux:main -- --${{ matrix.arch }} --publish never
          # The website links releases/latest/download/codync-<os>-<arch>.tar.gz.
          cd dist
          for f in codync-linux-${{ matrix.arch }}.*; do mv "$f" "${f/linux-${{ matrix.arch }}/${{ matrix.name }}}"; done
          for f in codync-${{ matrix.name }}.*; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: codync-${{ matrix.name }}
          path: apps/desktop/dist/codync-${{ matrix.name }}.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/desktop/dist/codync-${{ matrix.name }}.*
            apps/desktop/dist/latest-linux*.yml
