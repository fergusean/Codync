name: Submit iOS

# Xcode Cloud archives the iOS app on the same v* tag and uploads it to TestFlight;
# this waits for that build and submits it for App Review.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to submit, e.g. 2.3.0"
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ios-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install pyjwt cryptography
      - name: Submit for review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # PRs merged since the previous release tag supply What's New when apps/ios/WhatsNew.md has no section.
          TAG="v${VERSION#v}"
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          git rev-list "${PREV:+$PREV..}$TAG" > "$RUNNER_TEMP/commits.txt"
          gh pr list --state merged --limit 200 --json body,mergeCommit > "$RUNNER_TEMP/prs.json"
          export PRS="$RUNNER_TEMP/prs.json" COMMITS="$RUNNER_TEMP/commits.txt"
          # A tag run waits for the build Xcode Cloud starts now, not an older upload.
          [[ "$GITHUB_EVENT_NAME" == push ]] && export SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 tools/asc-submit.py "${VERSION#v}"
